name: Idea
description: Something you would like the plugin to do, or to do better.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it helps
      description: The problem it solves for you, or what you do today instead.
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Anything else
